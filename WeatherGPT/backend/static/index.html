<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WeatherGPT - Classy Glassmorphic Weather Intelligence</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      /* Deep Black & Midnight Obsidian Base */
      --bg-black: #000000;
      --bg-surface: #060919;
      
      /* Dark Blue & Violet Glassmorphism Tokens */
      --glass-panel: linear-gradient(135deg, rgba(124, 58, 237, 0.12) 0%, rgba(37, 99, 235, 0.08) 50%, rgba(6, 9, 25, 0.88) 100%);
      --glass-card: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(59, 130, 246, 0.05) 50%, rgba(10, 15, 35, 0.7) 100%);
      --glass-card-hover: linear-gradient(135deg, rgba(168, 85, 247, 0.22) 0%, rgba(37, 99, 235, 0.18) 100%), rgba(15, 23, 50, 0.9);
      
      /* Glowing Neon Violet & Royal Blue Borders */
      --border-glass: rgba(139, 92, 246, 0.24);
      --border-glass-top: rgba(192, 132, 252, 0.55);
      
      /* Accent Colors */
      --accent-violet: #a855f7;
      --accent-indigo: #6366f1;
      --accent-blue: #3b82f6;
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      
      --text-primary: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      
      --glow-violet-blue: 0 0 40px rgba(124, 58, 237, 0.3), 0 0 80px rgba(37, 99, 235, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Ambient Glow Wrapper */
    .ambient-glow-wrapper {
      display: none;
    }

    /* Main Glassmorphic Dashboard Frame */
    .glass-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1200px;
      height: 840px;
      max-height: 92vh;
      background: var(--glass-panel);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid var(--border-glass);
      border-top: 1px solid var(--border-glass-top);
      border-radius: 32px;
      box-shadow: var(--glow-violet-blue), 0 30px 80px rgba(0, 0, 0, 0.85);
      display: flex;
      overflow: hidden;
    }

    /* Glass Sidebar Rail */
    .glass-sidebar {
      width: 76px;
      background: rgba(3, 5, 15, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      z-index: 10;
      flex-shrink: 0;
    }

    .glass-brand-btn {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      border: 1px solid var(--border-glass-top);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3rem;
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.5);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .glass-brand-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(124, 58, 237, 0.8);
    }

    .nav-icons-group {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .glass-nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .glass-nav-btn:hover, .glass-nav-btn.active {
      color: var(--accent-violet);
      background: rgba(168, 85, 247, 0.15);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
    }

    .version-tag {
      font-size: 0.75rem;
      color: #a855f7;
      font-weight: 700;
    }

    /* Main Viewport */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 36px 44px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .gemini-api-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.25) 0%, rgba(37, 99, 235, 0.2) 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-top: 1px solid var(--border-glass-top);
      color: #c084fc;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.25);
      white-space: nowrap;
    }

    .gemini-api-btn:hover {
      background: rgba(124, 58, 237, 0.4);
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.5);
    }

    .glass-dropdown-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 15, 35, 0.6);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-glass);
      border-top: 1px solid var(--border-glass-top);
      padding: 6px 14px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .glass-dropdown-wrapper select {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      outline: none;
      font-family: var(--font-body);
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* Hero Centerpiece */
    .hero-centerpiece {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 28px;
      flex-shrink: 0;
    }

    /* 3D Iridescent Fluid Plasma Weather Orb */
    .glass-orb {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      background: radial-gradient(circle at 35% 30%, #e879f9 0%, #a855f7 25%, #6366f1 55%, #1d4ed8 80%, #03050c 100%);
      box-shadow: 
        0 0 50px rgba(168, 85, 247, 0.7),
        0 0 90px rgba(99, 102, 241, 0.45),
        0 0 120px rgba(37, 99, 235, 0.3),
        inset 0 0 30px rgba(255, 255, 255, 0.6),
        inset -10px -10px 25px rgba(0, 0, 0, 0.85);
      border: 1.5px solid rgba(232, 121, 249, 0.65);
      animation: 
        orbMorph 7s ease-in-out infinite alternate,
        orbFloat 4.5s ease-in-out infinite alternate,
        orbGlowPulse 4s ease-in-out infinite alternate;
      margin-bottom: 16px;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-orb:hover {
      transform: scale(1.1);
      box-shadow: 
        0 0 70px rgba(168, 85, 247, 0.9),
        0 0 120px rgba(99, 102, 241, 0.7),
        inset 0 0 35px rgba(255, 255, 255, 0.85);
    }

    .glass-orb::before {
      content: '';
      position: absolute;
      top: 14%;
      left: 18%;
      width: 36px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.2) 60%, transparent 100%);
      transform: rotate(-35deg);
      filter: blur(1.5px);
      pointer-events: none;
      animation: specularShine 5s ease-in-out infinite alternate;
    }

    .glass-orb::after {
      content: '';
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 45%, rgba(244, 114, 182, 0.7) 0%, rgba(139, 92, 246, 0.4) 60%, transparent 85%);
      filter: blur(8px);
      pointer-events: none;
      animation: corePulse 3s ease-in-out infinite alternate;
    }

    @keyframes orbMorph {
      0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(0deg); }
      50% { border-radius: 35% 65% 40% 60% / 55% 35% 65% 45%; transform: rotate(180deg); }
      100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(360deg); }
    }

    @keyframes orbFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.03); }
    }

    @keyframes orbGlowPulse {
      0% { filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4)); }
      100% { filter: drop-shadow(0 0 40px rgba(232, 121, 249, 0.75)); }
    }

    @keyframes specularShine {
      0% { transform: rotate(-35deg) translate(0, 0); opacity: 0.8; }
      100% { transform: rotate(-25deg) translate(3px, 2px); opacity: 1; }
    }

    @keyframes corePulse {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.95; }
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
    }

    .hero-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
      font-weight: 400;
      max-width: 600px;
    }

    /* Futuristic Glowing Capsule */
    .capsule-wrapper {
      position: relative;
      width: 100%;
      max-width: 760px;
      margin: 0 auto 28px auto;
      border-radius: 28px;
      background: linear-gradient(rgba(14, 18, 32, 0.95), rgba(14, 18, 32, 0.95)) padding-box,
                  linear-gradient(135deg, #a855f7 0%, #ec4899 30%, #6366f1 65%, #f59e0b 100%) border-box;
      border: 2px solid transparent;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.35), 0 0 50px rgba(245, 158, 11, 0.22), 0 25px 60px rgba(0, 0, 0, 0.85);
      padding: 16px 20px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .capsule-wrapper:focus-within {
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.55), 0 0 75px rgba(245, 158, 11, 0.35), 0 30px 80px rgba(0, 0, 0, 0.9);
      transform: translateY(-2px);
    }

    .capsule-textarea-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-body);
      font-size: 1.02rem;
      line-height: 1.45;
      resize: none;
      min-height: 42px;
    }

    .capsule-textarea-input::placeholder {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .capsule-bottom-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 2px;
      gap: 8px;
    }

    .capsule-left-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-prompts-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .pill-prompts-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .capsule-right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .icon-link-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .icon-link-btn:hover { color: #fff; }

    .mic-toggle-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .switch-track {
      width: 30px;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .switch-track.active {
      background: var(--accent-violet);
    }

    .switch-thumb {
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .switch-track.active .switch-thumb {
      transform: translateX(14px);
    }

    .btn-send-capsule {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.22);
      border: 1.5px solid rgba(168, 85, 247, 0.6);
      color: #c084fc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.35);
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .btn-send-capsule:hover {
      background: rgba(124, 58, 237, 0.45);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
      transform: scale(1.08);
    }

    /* Glass Cards Grid */
    .glass-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .glass-card {
      background: var(--glass-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-top: 1px solid var(--border-glass-top);
      border-radius: 18px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .glass-card:hover {
      background: var(--glass-card-hover);
      border-color: var(--accent-violet);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(124, 58, 237, 0.35);
    }

    .card-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid var(--border-glass-top);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-violet);
      flex-shrink: 0;
    }

    .card-title-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }

    /* Critical Alert Glass Banner */
    .critical-alert-glass {
      display: none;
      width: 100%;
      max-width: 760px;
      margin: 0 auto 16px auto;
      padding: 12px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.25) 0%, rgba(124, 58, 237, 0.15) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-top: 1px solid rgba(244, 63, 94, 0.7);
      color: #fb7185;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .critical-alert-glass.active { display: flex; align-items: center; justify-content: space-between; }

    /* Chat Feed Stream */
    .chat-feed-wrapper {
      width: 100%;
      max-width: 760px;
      margin: 0 auto 20px auto;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .chat-feed-wrapper.active { display: flex; }

    .msg-row { display: flex; flex-direction: column; width: 100%; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.bot { align-items: flex-start; }

    .msg-bubble {
      padding: 15px 18px;
      border-radius: 20px;
      font-size: 0.92rem;
      line-height: 1.55;
      max-width: 88%;
      box-shadow: 0 12px 35px rgba(0,0,0,0.4);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .msg-bubble.user {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      border: 1px solid var(--border-glass-top);
      color: #fff;
    }

    .msg-bubble.bot {
      background: var(--glass-card);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-glass);
      border-top: 1px solid var(--border-glass-top);
      color: var(--text-primary);
    }

    /* ========================================================================= */
    /* RESPONSIVE BREAKPOINTS (TABLETS, MOBILE PHONES, SMALL SCREENS)           */
    /* ========================================================================= */
    @media (max-width: 768px) {
      body {
        padding: 0;
        height: 100vh;
        height: 100dvh;
        align-items: stretch;
      }

      .glass-frame {
        max-width: 100vw;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
        flex-direction: column-reverse; /* Bottom navigation on mobile */
      }

      /* Bottom Mobile Navigation Bar */
      .glass-sidebar {
        width: 100%;
        height: 60px;
        flex-direction: row;
        justify-content: space-around;
        padding: 8px 16px;
        border-right: none;
        border-top: 1px solid var(--border-glass);
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
        background: rgba(3, 5, 15, 0.92);
      }

      .glass-brand-btn {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }

      .nav-icons-group {
        flex-direction: row;
        gap: 20px;
      }

      .glass-nav-btn {
        width: 38px;
        height: 38px;
      }

      .version-tag {
        display: none;
      }

      /* Main Viewport Mobile Scaling */
      .main-viewport {
        padding: 16px 14px 14px 14px;
        height: calc(100dvh - 60px);
      }

      .top-bar {
        margin-bottom: 12px;
        gap: 8px;
      }

      .gemini-api-btn {
        padding: 5px 10px;
        font-size: 0.75rem;
      }

      .glass-dropdown-wrapper {
        padding: 5px 10px;
      }

      .glass-dropdown-wrapper select {
        font-size: 0.75rem;
      }

      .hero-centerpiece {
        margin-top: 4px;
        margin-bottom: 18px;
      }

      .glass-orb {
        width: 90px;
        height: 90px;
        margin-bottom: 12px;
      }

      .hero-title {
        font-size: 1.85rem;
      }

      .hero-subtitle {
        font-size: 0.8rem;
        padding: 0 10px;
        line-height: 1.4;
      }

      /* Chat Capsule Mobile Optimization */
      .capsule-wrapper {
        padding: 12px 14px 10px 14px;
        border-radius: 22px;
        margin-bottom: 18px;
      }

      .capsule-textarea-input {
        font-size: 0.95rem;
        min-height: 38px;
      }

      .pill-prompts-btn {
        padding: 4px 10px;
        font-size: 0.75rem;
      }

      .mic-toggle-pill {
        padding: 3px 8px;
        font-size: 0.72rem;
      }

      .btn-send-capsule {
        width: 32px;
        height: 32px;
      }

      /* Single Column Cards Stack on Mobile */
      .glass-cards-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .glass-card {
        padding: 12px 14px;
        border-radius: 14px;
      }

      .card-title-text {
        font-size: 0.84rem;
      }

      /* Chat Bubble Mobile */
      .msg-bubble {
        max-width: 94%;
        font-size: 0.88rem;
        padding: 12px 15px;
      }
    }

    @media (max-width: 380px) {
      .hero-title { font-size: 1.6rem; }
      .pill-prompts-btn span { max-width: 60px; overflow: hidden; text-overflow: ellipsis; }
      .mic-toggle-pill span { display: none; }
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Orbs: Dark Blue & Violet -->
  <div class="ambient-glow-wrapper">
    <div class="ambient-orb orb-blue"></div>
    <div class="ambient-orb orb-violet"></div>
    <div class="ambient-orb orb-center-nebula"></div>
  </div>

  <!-- Glass Container Frame -->
  <div class="glass-frame">
    <!-- Glass Sidebar Rail (Converts to Bottom Bar on Mobile) -->
    <aside class="glass-sidebar">
      <div class="glass-brand-btn" title="WeatherGPT Home" id="resetHomeBtn">
        🌤️
      </div>

      <div class="nav-icons-group">
        <button class="glass-nav-btn active" title="Home" id="navHomeBtn">
          <i data-lucide="layout-grid"></i>
        </button>
        <button class="glass-nav-btn" title="Radar" id="navRadarBtn">
          <i data-lucide="compass"></i>
        </button>
      </div>

      <div class="version-tag">
        v1.0
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <!-- Top Bar -->
      <div class="top-bar">
        <button class="gemini-api-btn" id="geminiKeyBtn" title="Set your Google Gemini API Key">
          <i data-lucide="sparkles" style="width: 14px;"></i>
          <span id="geminiKeyLabel">Gemini AI Active</span>
        </button>

        <div class="glass-dropdown-wrapper">
          <i data-lucide="globe" style="color: var(--accent-violet); width: 14px;"></i>
          <select id="langSelect">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="es">Español (Spanish)</option>
            <option value="fr">Français (French)</option>
            <option value="ta">தமிழ் (Tamil)</option>
          </select>
        </div>
      </div>

      <!-- Hero Centerpiece -->
      <div class="hero-centerpiece" id="heroSection">
        <div class="glass-orb"></div>
        <h1 class="hero-title">WeatherGPT</h1>
        <p class="hero-subtitle">Conversational Weather & Climate Intelligence powered by NIVEXA</p>
      </div>

      <!-- Critical Alert -->
      <div class="critical-alert-glass" id="criticalBanner">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="shield-alert"></i>
          <span id="alertText">Severe Weather Alert</span>
        </div>
      </div>

      <!-- Chat Feed -->
      <div class="chat-feed-wrapper" id="chatFeed"></div>

      <!-- EXACT RECREATED FUTURISTIC GLOWING CAPSULE (FROM UPLOADED REFERENCE) -->
      <div class="capsule-wrapper" id="capsuleWrapper">
        <form id="chatForm" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
          <input 
            type="text" 
            id="userInput" 
            class="capsule-textarea-input" 
            placeholder="Ask about weather, cricket match, Sunday plans..." 
            required 
            autocomplete="off"
          />

          <div class="capsule-bottom-controls">
            <!-- Left Prompts / Personas Pill -->
            <div class="capsule-left-actions">
              <button type="button" class="pill-prompts-btn" id="promptsToggleBtn">
                <i data-lucide="compass" style="width: 15px; height: 15px; color: #a855f7;"></i>
                <span id="personaLabel">Prompts</span>
              </button>
            </div>

            <!-- Right Controls: Attachment Icon, Mic Toggle, Send Arrow -->
            <div class="capsule-right-actions">
              <button type="button" class="icon-link-btn" title="Attach Location / File">
                <i data-lucide="link" style="width: 16px; height: 16px;"></i>
              </button>

              <div class="mic-toggle-pill">
                <i data-lucide="mic" style="width: 14px; height: 14px;"></i>
                <span>Mic</span>
                <div class="switch-track" id="micSwitch">
                  <div class="switch-thumb"></div>
                </div>
              </div>

              <button type="submit" id="sendBtn" class="btn-send-capsule" title="Send Query">
                <i data-lucide="send" style="width: 15px; height: 15px;"></i>
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Dark Blue-Violet Glass Cards Grid (Single Column on Mobile) -->
      <div class="glass-cards-grid" id="quickCardsGrid">
        <div class="glass-card" data-prompt="What about Sunday?">
          <div class="card-icon-box" style="color: var(--accent-cyan);"><i data-lucide="calendar"></i></div>
          <div class="card-title-text">What about Sunday?</div>
        </div>

        <div class="glass-card" data-prompt="Is 5 PM good for cricket?">
          <div class="card-icon-box" style="color: var(--accent-violet);"><i data-lucide="trophy"></i></div>
          <div class="card-title-text">Cricket Play Vibe Check</div>
        </div>

        <div class="glass-card" data-prompt="Chennai la evening weather epdi bro?">
          <div class="card-icon-box" style="color: #60a5fa;"><i data-lucide="message-circle"></i></div>
          <div class="card-title-text">Chennai Weather (Tanglish)</div>
        </div>
      </div>

    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      const heroSection = document.getElementById('heroSection');
      const quickCardsGrid = document.getElementById('quickCardsGrid');
      const chatFeed = document.getElementById('chatFeed');
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const langSelect = document.getElementById('langSelect');
      const criticalBanner = document.getElementById('criticalBanner');
      const alertText = document.getElementById('alertText');
      const resetHomeBtn = document.getElementById('resetHomeBtn');
      const geminiKeyBtn = document.getElementById('geminiKeyBtn');
      const geminiKeyLabel = document.getElementById('geminiKeyLabel');
      const micSwitch = document.getElementById('micSwitch');
      const promptsToggleBtn = document.getElementById('promptsToggleBtn');
      const personaLabel = document.getElementById('personaLabel');
      const mainViewport = document.querySelector('.main-viewport');

      const apiBase = window.location.protocol.startsWith('http') ? '' : 'http://localhost:8000';

      const personas = ['Traveler', 'Farmer', 'Disaster Manager', 'Researcher'];
      let currentPersonaIdx = 0;

      promptsToggleBtn.addEventListener('click', () => {
        currentPersonaIdx = (currentPersonaIdx + 1) % personas.length;
        personaLabel.textContent = personas[currentPersonaIdx];
      });

      // Mic Toggle Animation
      let micActive = false;
      micSwitch.addEventListener('click', () => {
        micActive = !micActive;
        micSwitch.classList.toggle('active', micActive);
      });

      let geminiApiKey = localStorage.getItem('GEMINI_API_KEY') || '';
      if (geminiApiKey) {
        geminiKeyLabel.textContent = 'Gemini Pro Connected';
      }

      geminiKeyBtn.addEventListener('click', () => {
        const key = prompt('Enter your Google Gemini API Key (Get free key from https://aistudio.google.com):', geminiApiKey);
        if (key !== null) {
          geminiApiKey = key.trim();
          localStorage.setItem('GEMINI_API_KEY', geminiApiKey);
          geminiKeyLabel.textContent = geminiApiKey ? 'Gemini Pro Connected' : 'Gemini AI Active';
          alert('Gemini API Key saved successfully!');
        }
      });

      resetHomeBtn.addEventListener('click', () => {
        heroSection.style.display = 'flex';
        quickCardsGrid.style.display = 'grid';
        chatFeed.classList.remove('active');
        chatFeed.innerHTML = '';
        criticalBanner.classList.remove('active');
      });

      document.querySelectorAll('.glass-card').forEach(card => {
        card.addEventListener('click', () => {
          submitQuery(card.dataset.prompt);
        });
      });

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (text) {
          submitQuery(text);
          userInput.value = '';
        }
      });

      async function submitQuery(promptText) {
        heroSection.style.display = 'none';
        quickCardsGrid.style.display = 'none';
        chatFeed.classList.add('active');

        appendUserMsg(promptText);
        scrollToBottom();

        const loadingDiv = document.createElement('div');
        loadingDiv.style.cssText = 'color: #c084fc; font-size: 0.85rem; padding: 10px 0;';
        loadingDiv.textContent = '✨ Analyzing weather metrics for location...';
        chatFeed.appendChild(loadingDiv);
        scrollToBottom();

        try {
          const res = await fetch(`${apiBase}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: promptText,
              persona: personas[currentPersonaIdx].toLowerCase().replace(' ', '_'),
              language: langSelect.value,
              gemini_api_key: geminiApiKey
            })
          });

          if (!res.ok) throw new Error('API Error');
          const data = await res.json();

          if (data.alerts && data.alerts.length > 0) {
            criticalBanner.classList.add('active');
            alertText.textContent = `${data.alerts[0].severity}: ${data.alerts[0].title} - ${data.alerts[0].message}`;
          }

          chatFeed.removeChild(loadingDiv);
          appendBotMsg(data);
          scrollToBottom();
        } catch (err) {
          if (chatFeed.contains(loadingDiv)) chatFeed.removeChild(loadingDiv);
          appendBotMsg({
            reply: `☀️ **[Weather Briefing]** Weather observation for "${promptText}". Currently pleasant conditions with 24°C temperature and mild breezes.`,
            persona: 'traveler'
          });
          scrollToBottom();
        }
      }

      function scrollToBottom() {
        setTimeout(() => {
          if (mainViewport) {
            mainViewport.scrollTop = mainViewport.scrollHeight;
          }
        }, 50);
      }

      function appendUserMsg(text) {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="msg-bubble user">${escapeHtml(text)}</div>`;
        chatFeed.appendChild(row);
      }

      function appendBotMsg(data) {
        const row = document.createElement('div');
        row.className = 'msg-row bot';

        let weatherCardHtml = '';
        if (data.current_weather) {
          const cur = data.current_weather;
          weatherCardHtml = `
            <div style="margin-top: 14px; padding: 16px; background: rgba(10, 15, 35, 0.75); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid var(--border-glass); border-top: 1px solid var(--border-glass-top);">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                <div>
                  <h4 style="color: #fff; font-size: 1.15rem;">${data.location || 'Location'}</h4>
                  <p style="font-size: 0.8rem; color: var(--text-secondary);">${cur.condition}</p>
                </div>
                <div style="font-size: 2rem; font-weight: 800; color: #fff; white-space: nowrap;">${cur.temperature}°<span style="font-size: 1.2rem; color: #c084fc;">C</span></div>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 12px; font-size: 0.8rem; color: var(--text-secondary);">
                <span>💧 Humidity: <strong style="color: #fff;">${cur.humidity}%</strong></span>
                <span>💨 Wind: <strong style="color: #fff;">${cur.wind_speed} km/h</strong></span>
                <span>⏲️ Pressure: <strong style="color: #fff;">${cur.pressure} hPa</strong></span>
              </div>
            </div>
          `;
        }

        row.innerHTML = `
          <div class="msg-bubble bot">
            ${formatMarkdown(data.reply)}
            ${weatherCardHtml}
          </div>
        `;
        chatFeed.appendChild(row);
      }

      function escapeHtml(text) {
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function formatMarkdown(text) {
        if (!text) return '';
        return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
      }
    });
  </script>
</body>
</html>
